org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 依赖全部已是 AndroidX，无需 jetifier 转换（省时间与中间产物）
android.enableJetifier=false
# 本机 pub 缓存位于 C: 盘，而工程在 D: 盘。Kotlin 增量编译在记录缓存时会用
# File.relativeTo 计算相对路径，跨盘符会抛
# "this and base files have different roots"，导致 assembleRelease 失败。
# 关闭增量编译即可规避（代价是每次全量编译 Kotlin，构建稍慢）。
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
