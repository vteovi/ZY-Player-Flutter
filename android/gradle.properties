# ⚠️ Gradle 守护进程内存上限：本机实体内存仅 ~8GB，
# 原来 -Xmx8G 等于允许 JVM 吃掉超过物理内存的量，触发系统疯狂 swap → 编译时整机卡顿。
# 降到 3G，保证构建过程中内存留在物理内存里、不 swap，系统保持响应。
# （Kotlin 走 in-process，dex/R8 也在同一个 Gradle JVM 内，都受这个上限约束。）
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# 依赖全部已是 AndroidX，无需 jetifier 转换（省时间与中间产物）
android.enableJetifier=false
# 本机 pub 缓存位于 C: 盘，而工程在 D: 盘。Kotlin 增量编译在记录缓存时会用
# File.relativeTo 计算相对路径，跨盘符会抛
# "this and base files have different roots"，导致 assembleRelease 失败。
# 关闭增量编译即可规避（代价是每次全量编译 Kotlin，构建稍慢）。
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
