name: zy_player
description: "ZY Player 移动端 APP —— 由 uni-app 版本重写的 Flutter 版本"
publish_to: 'none'

# 原 uni-app 版本 versionName 0.1.2 / versionCode 102
# ⚠️ versionCode（+ 后面的数字）必须严格递增，否则 Android 拒绝覆盖安装旧包
#    （0.1.3=103，1.0.0=104，1.1.0=105，1.1.1=106，1.1.2=107，1.2.0=108，1.2.1=109，1.3.0=111，1.3.1=112，1.4.0=113，1.5.0=114，依次 +1）
#    ⚠️ 110 已被 TVBox 测试版（已回退）占用，1.3.0 从 111 起跳
version: 1.9.8+157

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 状态管理
  provider: ^6.1.4
  # 本地存储（对应 uni.setStorageSync）
  shared_preferences: ^2.5.3
  # 网络请求（对应 uni-ajax）
  http: ^1.6.0
  # XML 解析（对应 fast-xml-parser，用于 xml 类型的视频源）
  xml: ^6.5.0
  # 封面图缓存
  cached_network_image: ^3.4.1
  # 共享图片缓存管理器（扩大默认缓存容量，需直接依赖以自定义 CacheManager）
  flutter_cache_manager: ^3.4.5
  # 视频播放（Android 侧由 ExoPlayer 解码，原生支持 m3u8/HLS）
  video_player: ^2.9.5
  # Windows 桌面播放实现（video_player 平台接口，内置 FFmpeg 支持 HLS；
  # 仅在 main() 里 Platform.isWindows 时 registerWith，Android 不受影响）
  fvp: ^0.38.1
  # Windows 桌面 sqflite 实现（封面缓存 flutter_cache_manager 底层用 sqflite，
  # 官方 sqflite 无 Windows 实现，main() 里切到 FFI 工厂）
  sqflite_common_ffi: ^2.3.0
  # 本地文件选择（导入 TVBox / ZYFun 配置 JSON、备份/恢复文件，跨 Android / Windows）
  file_picker: ^8.3.0
  # 获取下载文件夹路径（Windows 备份直接落盘到下载目录）
  path_provider: ^2.1.5

# 本地修正版 video_player_android：
# 上游在 Build.VERSION.SDK_INT < 29 时不交换视频宽高，竖屏视频（1920x1080 + 90° 旋转标记）
# 被上报成横屏比例，Flutter 按 16:9 摆放竖屏纹理 → 画面被横向拉伸。
# 详见 third_party/video_player_android/.../TextureExoPlayerEventListener.java 中的 FIX 注释。
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/init_site.json
    - assets/data/init_setting.json
    - assets/images/logo.png
