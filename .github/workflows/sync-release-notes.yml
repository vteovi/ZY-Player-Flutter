name: Sync Release Notes

# 补写已发布 Release 的正文：用 更新记录.MD 里该版本那一节重新生成正文，
# 覆盖到指定 tag 的 Release 上。发布后才发现正文要改（漏了说明、要加更新
# 记录链接）时用这个，不必重新跑一遍完整构建、也不会动任何产物。
#
# 两种触发方式：
#   1) Actions -> Sync Release Notes -> Run workflow，填 tag（如 v1.44.2）
#   2) 往仓库根目录的 .release-sync 里写一行 tag 再 push —— 本地没有可用的
#      GitHub token 时走这条，推完 CI 自动读文件里的 tag 改正文。
#      文件留着不用清理，下次改内容再推一次即可。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要补写正文的 tag（如 v1.44.2）'
        required: true
        type: string
  push:
    paths:
      - '.release-sync'
      # 改本文件也会跑一遍：调脚本时方便当场验证效果
      - '.github/workflows/sync-release-notes.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 确定要同步的 tag
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(tr -d '[:space:]' < .release-sync 2>/dev/null || true)
          fi
          TAG="${TAG#v}"
          if [ -z "$TAG" ]; then
            echo "::error::没有拿到 tag，检查 .release-sync 内容或 workflow 输入"
            exit 1
          fi
          echo "tag=v$TAG" >> "$GITHUB_OUTPUT"
          echo "目标: v$TAG"

      - name: 重新生成正文并写回 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          # 链接指向 tag 本身，而不是本次运行所在的分支
          NOTES_REF: ${{ steps.target.outputs.tag }}
        run: |
          set -uo pipefail
          echo "gh: $(gh --version 2>&1 | head -n 1)"
          if ! OUT=$(gh release view "$TAG" 2>&1 > /dev/null); then
            echo "gh release view 失败：$OUT"
            echo "现有 Release（最多 5 条）:"
            gh release list --limit 5 2>&1 || true
            echo "::error::读不到 Release $TAG，见上方 gh 输出"
            exit 1
          fi
          bash tools/release-notes.sh "${TAG#v}" release-notes.md .
          gh release edit "$TAG" --notes-file release-notes.md
          echo "已更新 $TAG 的 Release 正文"
