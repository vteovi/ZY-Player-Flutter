name: Build APK + Windows

# 用法：
#   1) 手动：仓库页面 Actions -> Build APK + Windows -> Run workflow，选打包方式
#   2) 自动：推一个 v 开头的 tag（如 v1.17.0）会构建 APK + Windows 版，并创建 Release
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '打包方式'
        required: true
        default: split
        type: choice
        options:
          - split   # 三个按 ABI 拆分的包（arm64 / armv7 / x86_64），推荐
          - fat     # 单个万能包（三合一，约 68MB）
          - both    # 两种都出（耗时约翻倍）
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.32.6
  # android/app/build.gradle.kts 里硬编码了 ndkVersion，runner 上缺这个版本会构建失败
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    # 固定到 24.04：ubuntu-latest 自 2026-10 起陆续迁到 Ubuntu 26，
    # 镜像里 SDK/NDK 的路径与预装包可能变化，容易突然构建失败。固定版本 = 可复现。
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取版本号（pubspec.yaml）
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "读取到 version: $V"
          echo "full=$V" >> "$GITHUB_OUTPUT"
          echo "name=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${V##*+}" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 拉取依赖
        run: flutter pub get

      # 正式 release 签名。需要两个 Secret（仓库 Settings -> Secrets -> Actions）：
      #   KEYSTORE_BASE64    : 密钥库文件的 base64（本地 base64 -w0 zy-player-release.jks）
      #   KEYSTORE_PASSWORD  : 密钥库口令（alias 固定 zyplayer，keypass 与 storepass 相同）
      # 步骤会现场生成 android/key.properties，Gradle 据此签名；
      # 两个 Secret 都不配时才退回 debug 签名（那种包无法覆盖安装正式版）。
      - name: 配置 release 签名
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD，本次退回 runner 随机生成的 debug 签名（与正式版签名不同，无法覆盖安装）"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/sign"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=zyplayer\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/sign/release.jks" "$KS_PASS" "$KS_PASS" > android/key.properties
          echo "已生成 android/key.properties，证书信息："
          keytool -list -v -keystore "$RUNNER_TEMP/sign/release.jks" \
            -storepass "$KS_PASS" -alias zyplayer 2>/dev/null \
            | grep -E 'Alias name|SHA1:|SHA-1:|Valid from' || true

      - name: 确保 NDK 已安装
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK/ndk/${NDK_VERSION}" ]; then
            echo "NDK ${NDK_VERSION} 已存在"
          else
            echo "安装 NDK ${NDK_VERSION} ..."
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          fi

      - name: 构建（三个 ABI 拆分包）
        if: inputs.variant == 'split' || inputs.variant == 'both' || github.event_name == 'push'
        run: flutter build apk --release --split-per-abi

      - name: 收集拆分包
        if: inputs.variant == 'split' || inputs.variant == 'both' || github.event_name == 'push'
        run: bash tools/ci-collect-apk.sh "${{ steps.ver.outputs.name }}"

      - name: 构建（fat 万能包）
        if: inputs.variant == 'fat' || inputs.variant == 'both'
        run: flutter build apk --release

      - name: 收集 fat 包
        if: inputs.variant == 'fat' || inputs.variant == 'both'
        run: bash tools/ci-collect-apk.sh "${{ steps.ver.outputs.name }}"

      - name: 上传产物（可在 Actions 页面下载）
        uses: actions/upload-artifact@v7
        with:
          name: ZY-Player-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: dist/*.apk
          retention-days: 30

      - name: 发布到 GitHub Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 额外放一份固定文件名的 arm64 包：应用内更新的 update.json 里
          # apkUrl 指向 releases/latest/download/ZY-Player-arm64-latest.apk，
          # 这样每次发版都不必再改清单里的下载地址。
          ARM=$(ls dist/*-arm64.apk 2>/dev/null | head -n 1 || true)
          if [ -n "$ARM" ]; then
            cp "$ARM" dist/ZY-Player-arm64-latest.apk
            echo "已生成固定名副本 dist/ZY-Player-arm64-latest.apk"
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # 另一个 job（Windows 版）也在往同一个 tag 发东西，可能同时发现
            # Release 还不存在 —— 谁先谁后都行，创建失败就交给 upload 处理。
            gh release create "$GITHUB_REF_NAME" \
              --title "ZY Player $GITHUB_REF_NAME" \
              --generate-notes || true
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

  # ---------------------------------------------------------------- #
  # Windows 桌面版：与 APK 并行跑在独立 runner 上，互不影响。
  # 产物是 zip（exe + dll + data 必须整目录分发，单拷 exe 跑不起来）。
  # 只在推 v* tag 时挂到 Release；手动触发时只留 Artifacts。
  # ---------------------------------------------------------------- #
  build-windows:
    # 固定 2022：windows-latest 后续会迁到 2025，镜像里的 VS/SDK 版本可能变。
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取版本号（pubspec.yaml）
        id: ver
        shell: bash
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "读取到 version: $V"
          echo "name=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${V##*+}" >> "$GITHUB_OUTPUT"

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 首次会下载 fvp 依赖的 ffmpeg 预编译包并编译 C++，约 3~8 分钟。
      # 若这一步因下载超时变红，重跑一次即可，不影响 APK 那个 job。
      - name: 构建 Windows 桌面版
        run: flutter build windows --release

      - name: 打包 zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.name }}"
          $zip = "dist\ZY-Player-v$ver-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zip -Force
          Get-Item $zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: 上传产物（可在 Actions 页面下载）
        uses: actions/upload-artifact@v7
        with:
          name: ZY-Player-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-windows
          path: dist/*.zip
          retention-days: 30

      - name: 发布到 GitHub Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "ZY Player $GITHUB_REF_NAME" \
              --generate-notes || true
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
