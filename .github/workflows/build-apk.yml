name: Build APK

# 用法：
#   1) 手动：仓库页面 Actions -> Build APK -> Run workflow，选打包方式
#   2) 自动：推一个 v 开头的 tag（如 v1.17.0）会构建并直接创建 Release
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '打包方式'
        required: true
        default: split
        type: choice
        options:
          - split   # 三个按 ABI 拆分的包（arm64 / armv7 / x86_64），推荐
          - fat     # 单个万能包（三合一，约 68MB）
          - both    # 两种都出（耗时约翻倍）
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.32.6
  # android/app/build.gradle.kts 里硬编码了 ndkVersion，runner 上缺这个版本会构建失败
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    # 固定到 24.04：ubuntu-latest 自 2026-10 起陆续迁到 Ubuntu 26，
    # 镜像里 SDK/NDK 的路径与预装包可能变化，容易突然构建失败。固定版本 = 可复现。
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取版本号（pubspec.yaml）
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')
          echo "读取到 version: $V"
          echo "full=$V" >> "$GITHUB_OUTPUT"
          echo "name=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${V##*+}" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 拉取依赖
        run: flutter pub get

      # 可选步骤：配了密钥就用你的签名，没配则用 runner 自动生成的 debug 签名。
      # 为什么要配：android/app/build.gradle.kts 的 release 用的是 debug 签名，
      # 而 runner 每次构建都会随机生成一个新的 debug keystore —— 签名和你本地出的包
      # 不一致，手机上装过本地包就覆盖不了（必须先卸载）。把本地
      # ~/.android/debug.keystore 存进 Secret 后，云端出的包和本地包签名完全一致。
      - name: 恢复签名密钥（可选，未配置则跳过）
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::未配置 DEBUG_KEYSTORE_BASE64，本次使用 runner 自动生成的 debug 签名（云端包与本地包签名不同，覆盖安装前需先卸载旧版）"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KS_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "已恢复自定义 debug.keystore，签名指纹："
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass "${KS_PASS:-android}" 2>/dev/null \
            | grep -E 'Alias name|SHA1:|SHA-1:' || true

      - name: 确保 NDK 已安装
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK/ndk/${NDK_VERSION}" ]; then
            echo "NDK ${NDK_VERSION} 已存在"
          else
            echo "安装 NDK ${NDK_VERSION} ..."
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          fi

      - name: 构建（三个 ABI 拆分包）
        if: inputs.variant == 'split' || inputs.variant == 'both' || github.event_name == 'push'
        run: flutter build apk --release --split-per-abi

      - name: 收集拆分包
        if: inputs.variant == 'split' || inputs.variant == 'both' || github.event_name == 'push'
        run: bash tools/ci-collect-apk.sh "${{ steps.ver.outputs.name }}"

      - name: 构建（fat 万能包）
        if: inputs.variant == 'fat' || inputs.variant == 'both'
        run: flutter build apk --release

      - name: 收集 fat 包
        if: inputs.variant == 'fat' || inputs.variant == 'both'
        run: bash tools/ci-collect-apk.sh "${{ steps.ver.outputs.name }}"

      - name: 上传产物（可在 Actions 页面下载）
        uses: actions/upload-artifact@v7
        with:
          name: ZY-Player-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: dist/*.apk
          retention-days: 30

      - name: 发布到 GitHub Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 额外放一份固定文件名的 arm64 包：应用内更新的 update.json 里
          # apkUrl 指向 releases/latest/download/ZY-Player-arm64-latest.apk，
          # 这样每次发版都不必再改清单里的下载地址。
          ARM=$(ls dist/*-arm64.apk 2>/dev/null | head -n 1 || true)
          if [ -n "$ARM" ]; then
            cp "$ARM" dist/ZY-Player-arm64-latest.apk
            echo "已生成固定名副本 dist/ZY-Player-arm64-latest.apk"
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "ZY Player $GITHUB_REF_NAME" \
              --generate-notes
          fi
